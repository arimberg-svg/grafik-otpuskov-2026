<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Общий календарь отпусков СПК</title>
  <meta name="theme-color" content="#4208a8" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --p: #4208a8;
      --p2: #5b21d6;
      --orange: #f07a14;
      --paper: #ffffff;
      --bg: #fff7ef;
      --ink: #1a1033;
      --muted: #5c5278;
      --line: rgba(66, 8, 168, 0.16);
      --warn: #c81e3a;
      --warn-deep: #9b1530;
      --warn-bg: #fdecee;
      --font: "Manrope", "Segoe UI", sans-serif;
      --display: "Geologica", "Manrope", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.45;
    }
    .glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(900px 420px at 8% -8%, rgba(240, 122, 20, 0.22), transparent 58%),
        radial-gradient(700px 380px at 96% 0%, rgba(66, 8, 168, 0.16), transparent 55%),
        linear-gradient(180deg, #ffffff 0%, #fff7ef 42%, #f3e8ff 100%);
    }
    .page {
      position: relative; z-index: 1;
      width: min(1320px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 56px;
    }
    .postcard {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(66, 8, 168, 0.08);
    }
    .hero {
      position: relative;
      padding: 28px 32px 26px;
      background: linear-gradient(135deg, #4208a8 0%, #6b21c8 52%, #f07a14 100%);
      color: #fff;
      overflow: hidden;
    }
    .hero-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    .brand img { height: 36px; width: auto; filter: brightness(0) invert(1); }
    .chip {
      background: rgba(255,255,255,.16);
      border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 700;
    }
    h1 {
      font-family: var(--display);
      font-size: clamp(22px, 3.2vw, 34px);
      margin: 0;
      letter-spacing: -0.03em;
      font-weight: 800;
    }
    .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .links a {
      color: #fff; text-decoration: none; font-weight: 700; font-size: 13px;
      background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28);
      border-radius: 999px; padding: 8px 14px;
    }
    .body { padding: 22px 26px 28px; }
    .legend {
      display: flex; gap: 14px; flex-wrap: wrap;
      color: var(--muted); font-size: 13px; font-weight: 650; margin: 0 0 14px;
    }
    .swatch {
      display: inline-block; width: 14px; height: 14px; margin-right: 6px;
      vertical-align: -2px; border-radius: 4px;
    }
    .shop {
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      background: #fff;
    }
    .shop h3 {
      margin: 0 0 4px;
      font-family: var(--display);
      font-size: 20px;
    }
    .meta { color: var(--muted); font-size: 12px; font-weight: 650; }
    .overview-title {
      margin: 18px 0 8px;
      font-family: var(--display);
      font-size: 16px;
    }
    .cal.overview {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 12px;
    }
    .month {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
    }
    .month h4 {
      margin: 0 0 10px;
      font-size: 15px;
      font-family: var(--display);
    }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .day, .dow {
      font-size: 12px; text-align: center; padding: 3px 0;
      position: relative; border-radius: 6px;
    }
    .dow { color: var(--muted); font-weight: 700; font-size: 11px; }
    .day.empty { visibility: hidden; }
    .day.named {
      min-height: 78px;
      padding: 3px 2px 4px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      gap: 2px;
      background: #faf7ff;
    }
    .day .dnum { font-size: 11px; font-weight: 800; line-height: 1; margin-bottom: 1px; }
    .rtag {
      display: block;
      font-size: 10px;
      line-height: 1.2;
      font-weight: 800;
      border-radius: 4px;
      padding: 2px 3px;
      text-align: left;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .rtag .rrole {
      display: block;
      font-size: 8px;
      letter-spacing: .04em;
      text-transform: uppercase;
      opacity: .92;
      font-weight: 800;
    }
    .rtag .rname {
      display: block;
      font-size: 10px;
      line-height: 1.15;
      font-weight: 800;
    }
    .rtag.past {
      background: #c4c4c8 !important;
      color: #5a5a5e !important;
      opacity: 0.85;
    }
    .day.past-day { background: #f3f3f5; opacity: 0.92; }
    .day.past-day .dnum { color: #8a8a90; }
    .day.today-day { box-shadow: inset 0 0 0 2px var(--p); }
    .day.conflict {
      box-shadow: inset 0 0 0 2px var(--warn);
      background: var(--warn-bg);
    }
    footer { color: var(--muted); font-size: 12px; font-weight: 650; margin-top: 16px; }
    @media (max-width: 900px) {
      .cal.overview { grid-template-columns: 1fr; }
      .hero, .body { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="page">
    <article class="postcard">
      <header class="hero">
        <div class="hero-top">
          <div class="brand"><img src="assets/logo.png" alt="У Михалыча" /></div>
          <div class="chip">Розница · 2026</div>
        </div>
        <h1>Общий календарь отпусков СПК</h1>
        <div class="links">
          <a href="index.html">← полный график розницы</a>
        </div>
      </header>
      <div class="body">
        <div class="legend">
          <span><i class="swatch" style="background:#16a34a"></i>СПК</span>
          <span><i class="swatch" style="background:#f07a14"></i>совмещение</span>
          <span><i class="swatch" style="background:#c4c4c8"></i>уже прошли</span>
          <span><i class="swatch" style="background:#16a34a"></i>ещё впереди / сейчас</span>
          <span><i class="swatch" style="background:var(--warn-bg);box-shadow:inset 0 0 0 2px var(--warn)"></i>несколько человек в один день</span>
        </div>
        <article class="shop">
          <h3>СПК сети</h3>
          <div class="meta" id="meta"></div>
          <h4 class="overview-title">Календарь до конца 2026 года</h4>
          <div class="cal overview" id="cal"></div>
        </article>
        <footer id="foot"></footer>
      </div>
    </article>
  </div>
  <script src="spk-calendar-data.js"></script>
  <script>
    if (!window.SPK_CALENDAR) {
      document.body.insertAdjacentHTML("afterbegin",
        "<p style='padding:24px;font:600 16px Manrope,sans-serif;color:#9b1530'>Не загрузился spk-calendar-data.js</p>");
    } else {
    const D = window.SPK_CALENDAR;
    const MONTHS = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
    const TODAY = new Date().toISOString().slice(0, 10);
    const FROM = "2026-09-01";
    const TO = "2026-12-31";

    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[m]));
    const fmt = (iso) => {
      if (!iso) return "—";
      const [y, m, d] = iso.split("-");
      return `${d}.${m}.${y}`;
    };
    const lastName = (fio) => (fio || "").split(/\s+/)[0] || "";
    const inPeriod = (iso, p) => p.start && p.end && iso >= p.start && iso <= p.end;

    // Unique people for calendar (one FIO — one person)
    const byFio = {};
    D.people.forEach(row => {
      const key = (row.fio || "").toLowerCase();
      if (!byFio[key]) {
        byFio[key] = {
          fio: row.fio,
          stores: [],
          combined: !!row.combined || !row.isSpkRole,
          isSpkRole: !!row.isSpkRole,
          periods: []
        };
      }
      const p = byFio[key];
      if (row.store && !p.stores.includes(row.store)) p.stores.push(row.store);
      p.combined = p.combined || !!row.combined || !row.isSpkRole;
      (row.periodsAll2026 || row.periodsRemaining || []).forEach(per => {
        if (!per.start || !per.end) return;
        // keep periods that touch Sep–Dec
        if (per.end < FROM || per.start > TO) return;
        const exists = p.periods.some(x => x.start === per.start && x.end === per.end);
        if (!exists) p.periods.push({ start: per.start, end: per.end, days: per.days });
      });
    });
    const people = Object.values(byFio).sort((a, b) => a.fio.localeCompare(b.fio, "ru"));
    const withVac = people.filter(p => p.periods.length);

    function roleTag(p, iso) {
      const period = p.periods.find(v => inPeriod(iso, v));
      const past = iso < TODAY;
      const bg = past ? "#c4c4c8" : (p.combined ? "#f07a14" : "#16a34a");
      const fg = past ? "#5a5a5e" : "#fff";
      const tip = `${p.fio} · ${p.stores.join(", ")} · ${fmt(period?.start)} — ${fmt(period?.end)}`;
      const label = p.combined ? "совм." : "СПК";
      return `<span class="rtag ${past ? "past" : "ahead"}" style="background:${bg};color:${fg}" title="${esc(tip)}">
        <span class="rrole">${esc(label)}</span>
        <span class="rname">${esc(lastName(p.fio))}</span>
      </span>`;
    }

    function calendarHtml() {
      // September–December
      return [8, 9, 10, 11].map(mi => {
        const name = MONTHS[mi];
        const first = new Date(2026, mi, 1);
        const startDow = (first.getDay() + 6) % 7;
        const dim = new Date(2026, mi + 1, 0).getDate();
        let cells = "";
        for (let i = 0; i < startDow; i++) cells += `<div class="day empty"></div>`;
        for (let d = 1; d <= dim; d++) {
          const iso = `2026-${String(mi + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
          const onDay = withVac.filter(p => p.periods.some(v => inPeriod(iso, v)));
          const conflict = onDay.length >= 2;
          const dayState = iso < TODAY ? "past-day" : (iso === TODAY ? "today-day" : "");
          cells += `<div class="day named ${conflict ? "conflict" : ""} ${dayState}">
            <span class="dnum">${d}</span>
            ${onDay.map(p => roleTag(p, iso)).join("")}
          </div>`;
        }
        return `<div class="month"><h4>${name}</h4><div class="days">
          ${["пн","вт","ср","чт","пт","сб","вс"].map(x => `<div class="dow">${x}</div>`).join("")}
          ${cells}
        </div></div>`;
      }).join("");
    }

    document.getElementById("meta").textContent =
      `${people.length} чел. · с отпуском до конца года ${withVac.length}`;
    document.getElementById("cal").innerHTML = calendarHtml();
    document.getElementById("foot").textContent =
      `Сеть «У Михалыча» · общий календарь отпусков СПК · сентябрь — декабрь 2026`;
    }
  </script>
</body>
</html>
